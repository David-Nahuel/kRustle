# Genera los datos y despliega la web en Vercel. Los datos (JSON y sprites) no se guardan en el
# repositorio: se generan aquí en cada ejecución y van solo en el despliegue.
#
# - A diario, para recoger los torneos nuevos de Limitless.
# - En cada push a main que toque la web, el pipeline o este workflow.
# - A mano desde "Run workflow" (con otro formato si hace falta).
#
# El formato se cambia con la variable de repositorio KRUSTLE_FORMAT (Settings → Variables).
# Secretos necesarios (Settings → Secrets): VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID.
name: Desplegar

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pipeline/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      format:
        description: "Formato de Limitless (M-C, M-D...)"
        required: false
      accept_drop:
        description: "Aceptar caída de datos (publicar aunque haya bastantes menos equipos que antes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Formato, lint y tests (ci.yml). En la ejecución diaria el código no cambia, así que se
  # salta: una lint nueva de clippy en Rust estable no debe frenar la actualización de datos.
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    # Se despliega si las comprobaciones pasan o se han saltado (ejecución diaria).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # La primera descarga de un formato tarda ~1 h por el rate limit de Limitless (50 peticiones / 5 min).
    timeout-minutes: 180
    env:
      FORMAT: ${{ inputs.format || vars.KRUSTLE_FORMAT || 'M-C' }}
      ACCEPT_DROP: ${{ inputs.accept_drop && '--accept-drop' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      # Respuestas de Limitless y sprites ya descargados: cada ejecución solo baja lo nuevo.
      # GitHub borra una caché que no se usa en 7 días; la ejecución diaria la mantiene viva.
      - uses: actions/cache@v6
        with:
          path: |
            pipeline/cache
            web/public/sprites
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      # Si Limitless, Smogon o un sprite fallan, se sigue con lo que haya en caché y se avisa
      # con una anotación en el resumen de la ejecución. Si la muestra sale vacía o con muchos
      # menos equipos que la anterior, falla y se queda la versión publicada (ver accept_drop).
      - name: Datos (Limitless, Smogon, Showdown, PokeAPI) y sprites
        run: cargo run --release --manifest-path pipeline/Cargo.toml -- update --format "$FORMAT" $ACCEPT_DROP

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build de la web
        working-directory: web
        run: |
          npm ci
          npx ng build

      # Con los datos nuevos, cada página arranca y pinta lo principal sin errores; si no, no se
      # publica y se queda la versión anterior. Usa el Chrome que ya trae el runner.
      - name: Prueba de humo
        working-directory: web
        run: npm run e2e

      # Informativo: el acierto de la inferencia con los datos nuevos, en el resumen de la ejecución.
      - name: Acierto de la inferencia
        continue-on-error: true
        working-directory: web
        run: |
          {
            echo '### Acierto de la inferencia'
            echo '```'
            npm run validate --silent -- "$FORMAT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Build Output API de Vercel: se sube la web ya construida y Vercel solo la sirve.
      # Las licencias de las librerías (MIT: hay que incluir sus avisos) se publican junto a la
      # web: el pie de página enlaza a ellas.
      - name: Preparar el despliegue
        working-directory: web
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r dist/web/browser .vercel/output/static
          cp dist/web/3rdpartylicenses.txt .vercel/output/static/
          cp vercel/config.json .vercel/output/config.json

      - name: Desplegar en Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@62.4.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
