[package]
name = "krustle-pipeline"
version = "0.1.0"
edition = "2024"
description = "Descarga torneos de Limitless, normaliza los equipos y genera los JSON estáticos que consume la web"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
json5 = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
webp = "0.3"
