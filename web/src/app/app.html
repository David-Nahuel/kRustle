<header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center gap-2 px-4 py-3 sm:gap-4">
    <a
      routerLink="/"
      class="flex shrink-0 items-center gap-2 text-lg font-bold tracking-tight text-amber-400"
      [attr.aria-label]="t('app.home')"
    >
      <img src="logo/Crustle.webp" alt="" width="32" height="32" class="h-8 w-8" />
      <!-- En móvil basta el logo: el espacio es para la navegación. -->
      <span class="hidden sm:inline">kRustle</span>
    </a>
    <!-- Si en una pantalla muy estrecha no cabe, se desplaza en vez de pisar el selector de idioma. -->
    <nav
      class="flex min-w-0 gap-0.5 overflow-x-auto text-xs [scrollbar-width:none] sm:gap-1 sm:text-sm"
      [attr.aria-label]="t('nav.main')"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-slate-800 text-slate-100"
          class="rounded-lg px-1.5 py-1.5 whitespace-nowrap text-slate-400 hover:text-slate-100 sm:px-3"
          >{{ t(link.label) }}</a
        >
      }
    </nav>
    <div
      class="ml-auto flex shrink-0 rounded-lg p-0.5 text-xs ring-1 ring-slate-700"
      role="group"
      [attr.aria-label]="t('nav.language')"
    >
      @for (lang of langs; track lang) {
        <button
          type="button"
          class="rounded-md px-1.5 py-1 font-semibold uppercase"
          [class]="
            i18n.lang() === lang
              ? 'bg-slate-700 text-slate-50'
              : 'text-slate-400 hover:text-slate-200'
          "
          [attr.aria-pressed]="i18n.lang() === lang"
          [attr.lang]="lang"
          (click)="i18n.lang.set(lang)"
        >
          {{ lang }}
        </button>
      }
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-5">
  <router-outlet />
</main>

@if (dataInfo(); as info) {
  <footer class="mx-auto max-w-5xl px-4 pb-6 text-xs text-slate-400">{{ info }}</footer>
}

<!-- Avisos abajo, uno encima de otro: deshacer lo último que se ha quitado y la versión nueva. -->
<div class="pointer-events-none fixed inset-x-4 bottom-4 z-40 mx-auto flex max-w-md flex-col gap-2">
  @if (undo.pending(); as pending) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-xl border border-slate-600 bg-slate-900/95 p-3 text-sm text-slate-200 shadow-lg backdrop-blur"
      role="status"
    >
      <span class="min-w-0 flex-1">{{ pending.message }}</span>
      <button
        type="button"
        class="shrink-0 rounded-lg px-3 py-1.5 font-semibold text-amber-300 ring-1 ring-amber-400/50 hover:bg-amber-400/10"
        (click)="undo.undo()"
      >
        {{ t('undo.action') }}
      </button>
    </div>
  }
  @if (updateReady()) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-xl border border-amber-500/40 bg-slate-900/95 p-3 text-sm text-slate-200 shadow-lg backdrop-blur"
      role="status"
    >
      <span class="min-w-0 flex-1">{{ t('update.ready') }}</span>
      <button
        type="button"
        class="shrink-0 rounded-lg bg-amber-400 px-4 py-2 font-semibold text-slate-950 hover:bg-amber-300"
        (click)="reload()"
      >
        {{ t('update.reload') }}
      </button>
    </div>
  }
</div>
